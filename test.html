<!DOCTYPE html>
<html>
<head>
    
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  await OneSignal.init({
    appId: "76d1e5ee-054f-4e3e-a858-b5c1e5c90dec",

    serviceWorkerPath: "OneSignalSDKWorker.js",
    serviceWorkerParam: {
      scope: "/fft/"
    }
  });
});
</script>
    
</head>
<body>

<button id="btn">Ask Permission</button>

<script>
localStorage.removeItem("fcm-token");
    
document.getElementById("btn").onclick = async () => {

    alert("Current: " + Notification.permission);

    const permission = await Notification.requestPermission();

    alert("Result: " + permission);

};

fetch("https://fft-msg-push-1-oxvm.onrender.com/api/send-notification", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        title: "FFT Tournament",
        message: "New Tournament is Live 🔥"
    })
});

</script>

</body>
</html>
