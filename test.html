<!DOCTYPE html>
<html>
<head>
    <title>Subscribe for Notification</title>
</head>
<body>

<h2>Waite a minute for subscribe</h2>

<script>

const PUBLIC_VAPID_KEY = "BCJvPUCtHK1Tt5pI4-RssQlaBXns9NvTCcaZiE3iAjKdMFvqH9AKuMul0i3Goq-9DB_AlqW4HGr_lfUUzfZY7MU";

async function subscribeUser() {
  tt();
  try{
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        alert("Push notification supported nahi hai");
        return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("Notification permission denied");
        return;
    }

    const registration = await navigator.serviceWorker.register("/fft/sw.js");

    const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
    });

    console.log(subscription);

    await fetch("https://fft-msg-push-1-oxvm.onrender.com/api/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(subscription)
    });

    alert("Subscribed");
  }catch(err){
      alert(err);
  }
}

async function tt() {
    try {
        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.getSubscription();

        if (subscription) {
            alert("User subscribed");
            return;
        }

        await subscription.unsubscribe();
        alert("Unsubscribed successfully");

    } catch (err) {
        alert(err.message);
    }
}

function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData = atob(base64);

    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}
    
</script>

</body>
</html>
