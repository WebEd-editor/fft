<!DOCTYPE html>
<html>
<head>
    <title>Send Notification</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  await OneSignal.init({
    appId: "76d1e5ee-054f-4e3e-a858-b5c1e5c90dec",

    serviceWorkerPath: "OneSignalSDKWorker.js",
    serviceWorkerParam: {
      scope: "/fft/"
    }
  });
});
</script>
</head>
<body>

<h2>Send Push Notification</h2>

<input type="text" id="title" placeholder="Notification Title">
<br><br>

<textarea id="message" placeholder="Notification Message"></textarea>
<br><br>

<button onclick="sendNotification()">Send Notification</button>

<script>
async function sendNotification() {

    const title = document.getElementById("title").value;
    const message = document.getElementById("message").value;

    if (!title || !message) {
        alert("Please enter title and message");
        return;
    }

    try {

        const response = await fetch("https://fft-msg-push-1-oxvm.onrender.com/api/send-notification", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title,
                message
            })
        });

        const data = await response.json();

        console.log(data);

        if (response.ok) {
            alert("✅ Notification request sent successfully");
        } else {
            alert("❌ " + (data.message || "Failed"));
        }

    } catch (err) {
        console.error(err);
        alert("Error: " + err.message);
    }

}
</script>

</body>
</html>
