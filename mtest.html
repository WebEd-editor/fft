<h3>sent a message to all subscribed users.</h3>
<input type="text" id="title">
<input type="text" id="message">
<button onclick="rr()">Sent message</button>

<script>
async function rr(){
  let title = document.getElementById("title").value;
  let message = document.getElementById("message").value;
  
  const res =  await fetch("https://fft-msg-push-1-oxvm.onrender.com/api/send", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title,
            message
        })
  });
  
  const text = await res.text();
  console.log(text);
}
</script>
